<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Planning Petit Sac</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#FBF6EE;--card:#FFFFFF;--ink:#17110C;--soft:#6B5F55;--line:#EADFCF;--terra:#C8442F;--ocre:#E8A33D;--gold:#F2B559;--ok:#22A45D;--warn:#B4561E}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--ink);font:400 15px/1.5 Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
.wrap{max-width:1080px;margin:0 auto;padding:28px 16px 80px}
header{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:26px}
.brand{font:600 13px Inter;letter-spacing:.16em;text-transform:uppercase;color:var(--terra)}
h1{font:italic 400 clamp(40px,7vw,64px)/1 'Instrument Serif',serif;margin-top:6px}
h1 em{color:var(--terra)}
.sub{color:var(--soft);margin-top:8px}
.refresh{font:600 13px Inter;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:9px 16px;cursor:pointer;color:var(--ink)}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:22px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px}
.kpi b{display:block;font:italic 400 40px/1 'Instrument Serif',serif}
.kpi span{color:var(--soft);font-size:13px}
.alert{display:none;gap:12px;align-items:flex-start;background:#FDEBDD;border:1px solid #F3C7A6;color:#6A2E10;border-radius:14px;padding:14px 16px;margin-bottom:22px}
.alert.on{display:flex}
.alert i{font-style:normal;font-weight:800}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px;position:sticky;top:0;background:var(--bg);padding:10px 0;z-index:5}
.chip{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:8px 15px;font:600 13px Inter;cursor:pointer;color:var(--ink)}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.sec{font:700 12px Inter;letter-spacing:.14em;text-transform:uppercase;color:var(--soft);margin:30px 0 12px;display:flex;align-items:center;gap:10px}
.sec::after{content:"";flex:1;height:1px;background:var(--line)}
.day{display:grid;grid-template-columns:120px 1fr;gap:16px;padding:14px 0;border-top:1px solid var(--line)}
.day:first-of-type{border-top:0}
.date{padding-top:4px}
.date .d{font:italic 400 30px/1 'Instrument Serif',serif}
.date .w{color:var(--soft);font-size:13px;text-transform:capitalize}
.date .today{display:inline-block;margin-top:6px;font:700 11px Inter;letter-spacing:.1em;text-transform:uppercase;background:var(--terra);color:#fff;padding:3px 8px;border-radius:999px}
.items{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.item{display:flex;gap:14px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px;min-width:0}
.thumb{position:relative;flex:none;width:84px;aspect-ratio:9/16;border-radius:10px;overflow:hidden;background:#EFE6D8;cursor:pointer;border:0;padding:0}
.thumb.post{aspect-ratio:4/5;align-self:flex-start}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb .play{position:absolute;inset:auto 6px 6px auto;width:26px;height:26px;border-radius:50%;background:rgba(23,17,12,.72);display:grid;place-items:center}
.thumb .play::before{content:"";border-left:9px solid #fff;border-top:6px solid transparent;border-bottom:6px solid transparent;margin-left:2px}
.meta{min-width:0;display:flex;flex-direction:column;gap:6px}
.tags{display:flex;gap:6px;flex-wrap:wrap}
.tag{font:700 11px Inter;letter-spacing:.06em;text-transform:uppercase;padding:3px 8px;border-radius:999px}
.t-reel{background:#F9E3DE;color:var(--terra)}
.t-post{background:#FCEBCD;color:#8A5A12}
.s-done{background:#DDF3E6;color:#18753F}
.s-next{background:#EEE9FB;color:#4A3AA8}
.s-late{background:#FDEBDD;color:var(--warn)}
.ttl{font:600 15px/1.3 Inter;overflow-wrap:anywhere}
.ep{font:italic 400 18px/1.1 'Instrument Serif',serif;color:var(--terra)}
.when{color:var(--soft);font-size:13px}
.snd{font:600 12px Inter;color:#4A3AA8;overflow-wrap:anywhere}
.meta a{color:var(--terra);font-weight:600;font-size:13px;text-decoration:none}
.meta a:hover{text-decoration:underline}
details{font-size:13px;color:var(--soft)}
details summary{cursor:pointer;font-weight:600;color:var(--ink);list-style:none}
details summary::-webkit-details-marker{display:none}
details summary::before{content:"+ ";color:var(--terra)}
details[open] summary::before{content:"− "}
details p{white-space:pre-wrap;margin-top:6px;overflow-wrap:anywhere}
.empty{color:var(--soft);font-style:italic;padding:8px 0}
.err{background:#FDEBDD;border-radius:12px;padding:16px;color:#6A2E10}
dialog{margin:auto;border:0;padding:0;background:transparent;max-width:min(420px,92vw)}
dialog::backdrop{background:rgba(12,8,6,.82)}
dialog video{width:100%;max-height:86vh;border-radius:16px;display:block;background:#000}
dialog img{width:100%;border-radius:16px;display:block}
dialog .x{position:absolute;top:10px;right:10px;z-index:2;background:#fff;border:0;border-radius:999px;width:36px;height:36px;font:700 18px Inter;cursor:pointer}
dialog form{position:relative}
footer{margin-top:40px;color:var(--soft);font-size:12px}
@media (max-width:720px){
  .kpis{grid-template-columns:repeat(2,1fr)}
  .day{grid-template-columns:1fr;gap:8px}
  .date{display:flex;align-items:baseline;gap:10px;padding:0}
  .date .today{margin:0}
  .items{grid-template-columns:1fr}
}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <div class="brand">Petit Sac · Instagram @petitsac_sng</div>
      <h1>Le <em>planning</em></h1>
      <p class="sub">Tout ce qui est publié et tout ce qui arrive. Chaque jour, un Reel à 16&#8239;h et une publication photo à 19&#8239;h (heure du Sénégal).</p>
    </div>
    <button class="refresh" id="refresh">Actualiser</button>
  </header>

  <div class="kpis" id="kpis"></div>
  <div class="alert" id="alert"></div>

  <div class="bar" id="filters">
    <button class="chip on" data-f="all">Tout</button>
    <button class="chip" data-f="reel">Reels</button>
    <button class="chip" data-f="post">Publications</button>
  </div>

  <div id="out"><p class="empty">Chargement…</p></div>
  <footer id="foot"></footer>
</div>

<dialog id="dlg"><form method="dialog"><button class="x" aria-label="Fermer">×</button><div id="dlgBody"></div></form></dialog>


<script>
// Sources : la file (posts.json), le journal (published.json) et la mise de côté (hold.json) du dépôt, lus en direct
const RAW = 'https://raw.githubusercontent.com/WissamBridi/petitsac-social/main/content/';
const MEDIA = '../images/';
const SLOT = { post: 'Publication', reel: 'Reel' };
const HOUR = { post: 19, reel: 16 };   // heure de publication (heure du Sénégal = UTC)
const END = { post: 23 * 60 + 30, reel: 23 * 60 + 50 };   // fin de la fenêtre de publication (minutes, UTC = heure du Sénégal)
let FILTER = 'all', DATA = null;

const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const dayKey = (d) => d.toISOString().slice(0, 10);
const fmtDay = (k) => new Date(k + 'T12:00:00Z').toLocaleDateString('fr-FR', { day: 'numeric', month: 'short', timeZone: 'UTC' });
const fmtWeek = (k) => new Date(k + 'T12:00:00Z').toLocaleDateString('fr-FR', { weekday: 'long', timeZone: 'UTC' });
const fmtTime = (iso) => new Date(iso).toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit', timeZone: 'UTC' }).replace(':', ' h ');
const kindOf = (p) => (p.type === 'reel' ? 'reel' : 'post');

// Titre lisible : la première phrase de la légende, l'épisode à part
function titles(p) {
  const lines = (p.caption || '').split('\n').map((l) => l.trim()).filter(Boolean);
  let ep = '';
  if (/^Le Déclic/.test(lines[0] || '')) ep = lines.shift();
  return { ep, title: (lines[0] || p.id).replace(/\s*✦\s*$/, '').replace(/ ([?!:;»])/g, '\u202f$1').replace(/« /g, '«\u202f') };
}

// Lecture par l'API GitHub publique (sans clé) : raw.githubusercontent garde un cache de 5 min après chaque modification
const API = 'https://api.github.com/repos/WissamBridi/petitsac-social/contents/content/';
const unb64 = (s) => new TextDecoder().decode(Uint8Array.from(atob(s.replace(/\n/g, '')), (c) => c.charCodeAt(0)));
try { localStorage.removeItem('ps-planning-token'); } catch {}   // ancienne clé de modification (fonction retirée le 29/10)

async function load() {
  const api = async (f) => { const r = await fetch(API + f + '?ref=main&t=' + Date.now(), { cache: 'no-store', headers: { Accept: 'application/vnd.github+json' } });
    if (!r.ok) throw new Error(f + ' : ' + r.status); return JSON.parse(unb64((await r.json()).content)); };
  try {
    const [posts, pub, hold] = await Promise.all([api('posts.json'), api('published.json'), api('hold.json').catch(() => [])]);
    return { posts, pub, hold };
  } catch (e) { /* quota de l'API dépassé : repli sur raw */ }
  const bust = '?t=' + Date.now();
  const get = (f) => fetch(RAW + f + bust, { cache: 'no-store' }).then((r) => { if (!r.ok) throw new Error(f + ' : ' + r.status); return r.json(); });
  const [posts, pub, hold] = await Promise.all([get('posts.json'), get('published.json'), get('hold.json').catch(() => [])]);
  return { posts, pub, hold };
}

function build({ posts, pub, hold }) {
  const byId = Object.fromEntries(posts.map((p) => [p.id, p]));
  const held = new Set(hold.map((h) => h.id));
  const done = new Set(pub.map((e) => e.id));
  const now = new Date(), today = dayKey(now), mins = now.getUTCHours() * 60 + now.getUTCMinutes();
  const rows = [];

  pub.forEach((e) => {
    const p = byId[e.id] || { id: e.id };
    const kind = e.kind || kindOf(p);
    rows.push({ p, kind, day: e.published_at.slice(0, 10), at: e.published_at, link: e.permalink, audio: e.audio, status: 'done' });
  });

  // À venir : on rejoue jour par jour la règle de publish.py (pick) : un élément par file et par jour,
  // d'abord le plus ancien daté dont la date est arrivée, sinon le premier sans date ; sinon le jour reste vide.
  const nextStart = {};
  ['post', 'reel'].forEach((kind) => {
    const doneToday = pub.some((e) => (e.kind || kindOf(byId[e.id] || {})) === kind && e.published_at.slice(0, 10) === today);
    const d = new Date(today + 'T00:00:00Z');
    if (doneToday || mins > END[kind]) d.setUTCDate(d.getUTCDate() + 1);
    nextStart[kind] = dayKey(d);
    const left = posts.filter((p) => kindOf(p) === kind && !done.has(p.id) && !held.has(p.id));
    let last = null;
    for (let guard = 0; left.length && guard < 1000; guard++) {
      const k = dayKey(d);
      const due = left.filter((p) => p.date && p.date <= k).sort((a, b) => (a.date < b.date ? -1 : a.date > b.date ? 1 : 0))[0];
      const p = due || left.find((x) => !x.date);
      if (p) { left.splice(left.indexOf(p), 1); rows.push({ p, kind, day: k, status: k === today && mins >= HOUR[kind] * 60 ? 'late' : 'next' }); last = k; }
      d.setUTCDate(d.getUTCDate() + 1);
    }
    nextStart[kind + 'Last'] = last;   // dernier jour programmé
  });
  return { rows, today, nextStart, held: posts.filter((p) => held.has(p.id)) };
}

// Son Instagram : celui posé à la publication (journal), sinon celui prévu
function sound(r) {
  const a = r.status === 'done' ? r.audio : r.p.audio;
  if (a === 'none') return 'Sans son ajouté';
  if (a && a.title) return a.title + (a.artist ? ' · ' + a.artist : '');
  return r.status === 'done' ? 'Son d’origine du Reel' : 'Son tendance du jour, choisi à la publication';
}

function card(r) {
  const { p, kind } = r, { ep, title } = titles(p);
  const img = kind === 'reel' ? p.cover : (p.images || [])[0];
  const media = img ? `<button class="thumb ${kind}" data-k="${kind}" data-v="${esc(p.video || '')}" data-i="${esc(img)}" aria-label="Voir">
      <img loading="lazy" src="${MEDIA + esc(img)}" alt="">${kind === 'reel' ? '<span class="play"></span>' : ''}</button>` : '';
  const st = { done: ['s-done', 'Publié'], next: ['s-next', 'Programmé'], late: ['s-late', 'En cours'] }[r.status];
  const when = r.status === 'done' ? `Publié à ${fmtTime(r.at)}` : r.status === 'late' ? `Publication en cours aujourd’hui (${HOUR[kind]} h)` : `Prévu à ${HOUR[kind]} h`;
  return `<div class="item">${media}<div class="meta">
    <div class="tags"><span class="tag t-${kind}">${SLOT[kind]}</span><span class="tag ${st[0]}">${st[1]}</span></div>
    ${ep ? `<div class="ep">${esc(ep)}</div>` : ''}<div class="ttl">${esc(title)}</div>
    <div class="when">${when}</div>
    ${kind === 'reel' ? `<div class="snd">♪ ${esc(sound(r))}</div>` : ''}
    ${r.link ? `<a href="${esc(r.link)}" target="_blank" rel="noopener">Voir sur Instagram ↗</a>` : ''}
    ${p.caption ? `<details><summary>Légende</summary><p>${esc(p.caption)}</p></details>` : ''}
  </div></div>`;
}

function render() {
  const { rows, today, nextStart, held } = build(DATA);
  const show = rows.filter((r) => FILTER === 'all' || r.kind === FILTER);
  const count = (k, s) => rows.filter((r) => r.kind === k && (s ? r.status === s : r.status !== 'done')).length;

  $('kpis').innerHTML = [
    [count('reel', 'done'), 'Reels publiés'], [count('reel'), 'Reels à venir'],
    [count('post', 'done'), 'Publications publiées'], [count('post'), 'Publications à venir'],
  ].map(([n, l]) => `<div class="kpi"><b>${n}</b><span>${l}</span></div>`).join('');

  // Alerte : une file vide = rien ne partira ce jour-là
  const msgs = ['post', 'reel'].map((k) => {
    const left = count(k);
    return left === 0 ? `<b>${SLOT[k]}s</b> : la file est vide, plus rien n’est programmé. Il faut préparer un nouveau lot.`
      : left <= 2 ? `<b>${SLOT[k]}s</b> : plus que ${left} en file, dernier envoi le ${fmtWeek(nextStart[k + 'Last'])} ${fmtDay(nextStart[k + 'Last'])}` : '';
  }).filter(Boolean);
  $('alert').innerHTML = `<i>!</i><div>${msgs.join('<br>')}</div>`;
  $('alert').classList.toggle('on', msgs.length > 0);

  const days = {};
  show.forEach((r) => (days[r.day] = days[r.day] || []).push(r));
  const keys = Object.keys(days).sort();
  const order = { reel: 0, post: 1 };
  const block = (ks) => ks.map((k) => `<div class="day"><div class="date"><div class="d">${fmtDay(k)}</div><div class="w">${fmtWeek(k)}</div>${k === today ? '<span class="today">Aujourd’hui</span>' : ''}</div>
      <div class="items">${days[k].sort((a, b) => order[a.kind] - order[b.kind]).map(card).join('')}</div></div>`).join('');
  const up = keys.filter((k) => days[k].some((r) => r.status !== 'done') || k === today);
  const past = keys.filter((k) => !up.includes(k)).reverse();

  $('out').innerHTML =
    `<div class="sec">À venir</div>${up.length ? block(up) : '<p class="empty">Rien de programmé pour l’instant.</p>'}` +
    `<div class="sec">Déjà publié</div>${past.length ? block(past) : '<p class="empty">Aucune publication.</p>'}` +
    (held.length && FILTER !== 'reel' ? `<div class="sec">Mis de côté</div><div class="items">${held.map((p) => card({ p, kind: kindOf(p), status: 'next' }).replace('Programmé', 'En attente').replace(/Prévu à \d+ h/, 'Hors file, en attente de votre feu vert')).join('')}</div>` : '');
  $('foot').textContent = 'Mis à jour le ' + new Date().toLocaleString('fr-FR', { timeZone: 'Africa/Dakar', dateStyle: 'long', timeStyle: 'short' }) + ' (heure du Sénégal).';
}

async function refresh() {
  try { DATA = await load(); render(); }
  catch (e) { $('out').innerHTML = `<div class="err">Impossible de lire le planning (${esc(e.message)}). Réessayez dans un instant.</div>`; }
}

$('filters').addEventListener('click', (e) => {
  const b = e.target.closest('.chip'); if (!b) return;
  FILTER = b.dataset.f; document.querySelectorAll('.chip').forEach((c) => c.classList.toggle('on', c === b));
  if (DATA) render();
});
$('out').addEventListener('click', (e) => {
  const t = e.target.closest('.thumb'); if (!t) return;
  $('dlgBody').innerHTML = t.dataset.k === 'reel' && t.dataset.v
    ? `<video src="${MEDIA + t.dataset.v}" poster="${MEDIA + t.dataset.i}" controls autoplay playsinline></video>`
    : `<img src="${MEDIA + t.dataset.i}" alt="">`;
  $('dlg').showModal();
});
$('dlg').addEventListener('close', () => ($('dlgBody').innerHTML = ''));
$('dlg').addEventListener('click', (e) => { if (e.target === $('dlg')) $('dlg').close(); });
$('refresh').addEventListener('click', refresh);
refresh();
</script>
</body>
</html>
