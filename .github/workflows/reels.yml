name: Publication Reel quotidien

on:
  schedule:
    # Reel du jour à 16 h (heure du Sénégal = UTC), comme le post. Créneaux de rattrapage ; publish.py ne publie
    # qu'un Reel par jour et seulement dans la plage 16:00-23:50 UTC.
    - cron: "12 16 * * *"
    - cron: "42 16 * * *"
    - cron: "12 17 * * *"
    - cron: "42 17 * * *"
    - cron: "12 18 * * *"
    - cron: "42 18 * * *"
    - cron: "12 19 * * *"
    - cron: "12 20 * * *"
    - cron: "12 21 * * *"
    - cron: "12 22 * * *"
    - cron: "12 23 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Préparer sans publier (1 = oui)"
        required: false
        default: "0"
      force_id:
        description: "Publier un id de post précis (optionnel)"
        required: false
        default: ""
  # Test technique : un push qui modifie ce fichier lance un run en DRY_RUN (ne publie jamais).
  push:
    branches: [main]
    paths: [".github/test-run-reel"]

permissions:
  contents: write

concurrency:
  group: ig-daily
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Publier le Reel du jour
        env:
          IG_USER_ID: "17841422677537452"
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          BASE_URL: "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/images/"
          GRAPH_VERSION: "v21.0"
          DRY_RUN: ${{ github.event_name == 'push' && '1' || github.event.inputs.dry_run }}
          FORCE_ID: ${{ github.event.inputs.force_id }}
          KIND: "reel"
        run: python3 scripts/publish.py

      - name: Journaliser le Reel publié
        if: ${{ always() && github.event_name != 'push' && github.event.inputs.dry_run != '1' }}
        run: |
          if [ -n "$(git status --porcelain content/published.json)" ]; then
            git config user.name "petitsac-bot"
            git config user.email "bot@petitsac.local"
            git add content/published.json
            git commit -m "chore: Reel publié le $(date -u +%Y-%m-%d)"
            git pull --rebase -q origin main || true
            git push
          else
            echo "Rien à journaliser."
          fi
